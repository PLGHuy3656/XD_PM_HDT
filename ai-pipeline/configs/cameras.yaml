# Mỗi camera/node có ID duy nhất (Assumption 6.1). Toạ độ line chuẩn hoá 0..1.
cameras:
  # 1. Nguồn Video có sẵn trong repo (mặc định đã cấu hình sẵn)
  - camera_id: CAM-01
    source: data/samples/10s.mp4
    source_type: video
    autostart: true              # Đặt true nếu muốn bật server là chạy luôn
    counting_line:
      start: [0.10, 0.55]
      end:   [0.90, 0.55]
    inside_side: positive