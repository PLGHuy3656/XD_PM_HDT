# ==============================================================================
# SwiftletCare — Fully Integrated Multi-Service Docker Compose (CP14-B)
# ==============================================================================
# Architecture:
# - Microservices: Frontend (Nginx), Gateway, Management, IoT, AI, Notification, Analytics
# - Messaging & Persistence: PostgreSQL Demo (Isolated), Redis, RabbitMQ, Mosquitto MQTT
# - Observability: Prometheus, Grafana (:3001), Loki, Promtail
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Isolated Demo Database (PostgreSQL 16)
  # Guaranteed ZERO mutation on Windows production databases (management_db/ai_db)
  # ----------------------------------------------------------------------------
  postgres-demo:
    image: postgres:16-alpine
    container_name: swiftletcare-postgres-demo
    hostname: postgres-demo
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_demo_2026
      POSTGRES_DB: postgres
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/01_init_all.sh:/docker-entrypoint-initdb.d/01_init_all.sh:ro
      - ./infrastructure/postgres/sql:/docker-entrypoint-initdb.d/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 2. Redis State & Cache
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: swiftletcare-redis
    hostname: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 3. RabbitMQ Message Broker
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: swiftletcare-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: swiftlet
      RABBITMQ_DEFAULT_PASS: swiftlet123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 4. Mosquitto MQTT Broker
  # ----------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: swiftletcare-mosquitto
    hostname: mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 5. Management Service
  # ----------------------------------------------------------------------------
  management-service:
    build:
      context: ./services/management-service
      dockerfile: Dockerfile
    container_name: swiftletcare-management-service
    hostname: management-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DATABASE_URL: postgresql://management_user:mgmt_password_2026@postgres-demo:5432/management_db
      JWT_SECRET: EiYHLpFfjDyuWweSQ67aEuuF_3JlpMq2RQpfaDZFNcpqe-gqVwR_2LXUk-aCN8V3
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: 8001
      INTERNAL_SERVICE_TOKEN: "internal_psk_key_swiftletcare_service_mesh_2026"
    depends_on:
      postgres-demo:
        condition: service_healthy
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 6. IoT Service
  # ----------------------------------------------------------------------------
  iot-service:
    build:
      context: ./services/iot-service
      dockerfile: Dockerfile
    container_name: swiftletcare-iot-service
    hostname: iot-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      MANAGEMENT_SERVICE_URL: http://management-service:8001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: swiftlet
      RABBITMQ_PASS: swiftlet123
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      IOT_SERVICE_HOST: 0.0.0.0
      IOT_SERVICE_PORT: 8002
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mosquitto:
        condition: service_started
      management-service:
        condition: service_started
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 7. AI Service
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: swiftletcare-ai-service
    hostname: ai-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      AI_DATABASE_URL: postgresql://ai_user:ai_dev_pass_2026@postgres-demo:5432/ai_db
      MANAGEMENT_SERVICE_URL: http://management-service:8001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: swiftlet
      RABBITMQ_PASS: swiftlet123
      INTERNAL_SERVICE_KEY: "internal_psk_key_swiftletcare_service_mesh_2026"
      JWT_SECRET: EiYHLpFfjDyuWweSQ67aEuuF_3JlpMq2RQpfaDZFNcpqe-gqVwR_2LXUk-aCN8V3
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: 8003
    depends_on:
      postgres-demo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      management-service:
        condition: service_started
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 8. Notification Service
  # ----------------------------------------------------------------------------
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: swiftletcare-notification-service
    hostname: notification-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      NOTIFICATION_DATABASE_URL: postgresql://notification_user:notification_dev_pass_2026@postgres-demo:5432/notification_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: swiftlet
      RABBITMQ_PASS: swiftlet123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MANAGEMENT_SERVICE_URL: http://management-service:8001
      NOTIFICATION_SERVICE_HOST: 0.0.0.0
      NOTIFICATION_SERVICE_PORT: 8004
    depends_on:
      postgres-demo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      management-service:
        condition: service_started
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 9. Analytics Service
  # ----------------------------------------------------------------------------
  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: swiftletcare-analytics-service
    hostname: analytics-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8005:8005"
    environment:
      ANALYTICS_DATABASE_URL: postgresql://analytics_user:analytics_password_2026@postgres-demo:5432/analytics_db
      MANAGEMENT_DATABASE_URL: postgresql://analytics_reader:analytics_reader_secure_pass_2026@postgres-demo:5432/management_db
      ANALYTICS_REPOSITORY_TYPE: postgresql
      ANALYTICS_SERVICE_HOST: 0.0.0.0
      ANALYTICS_SERVICE_PORT: 8005
    depends_on:
      postgres-demo:
        condition: service_healthy
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 10. API Gateway
  # ----------------------------------------------------------------------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: swiftletcare-gateway
    hostname: gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
      JWT_SECRET: EiYHLpFfjDyuWweSQ67aEuuF_3JlpMq2RQpfaDZFNcpqe-gqVwR_2LXUk-aCN8V3
      JWT_ALGORITHM: HS256
      MANAGEMENT_SERVICE_URL: http://management-service:8001
      IOT_SERVICE_URL: http://iot-service:8002
      AI_SERVICE_URL: http://ai-service:8003
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
      ANALYTICS_SERVICE_URL: http://analytics-service:8005
      ANALYTICS_SERVICE_DEPLOYED: "true"
      REDIS_URL: redis://redis:6379/1
    depends_on:
      management-service:
        condition: service_started
      iot-service:
        condition: service_started
      ai-service:
        condition: service_started
      notification-service:
        condition: service_started
      analytics-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 11. Frontend Web (Nginx SPA + Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swiftletcare-frontend
    hostname: frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 12. Monitoring Stack (Prometheus, Grafana, Loki, Promtail)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: swiftletcare-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - swiftletcare-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: swiftletcare-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=swiftletcare_admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - swiftletcare-network
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:2.9.5
    container_name: swiftletcare-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./infrastructure/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - swiftletcare-network

  promtail:
    image: grafana/promtail:2.9.5
    container_name: swiftletcare-promtail
    restart: unless-stopped
    volumes:
      - ./infrastructure/monitoring/loki/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - swiftletcare-network
    depends_on:
      - loki

# ------------------------------------------------------------------------------
# Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  postgres_demo_data:
    name: swiftletcare_postgres_demo_data
  redis_data:
    name: swiftletcare_redis_data
  rabbitmq_data:
    name: swiftletcare_rabbitmq_data
  mosquitto_data:
    name: swiftletcare_mosquitto_data
  prometheus_data:
    name: swiftletcare_prometheus_data
  grafana_data:
    name: swiftletcare_grafana_data
  loki_data:
    name: swiftletcare_loki_data

networks:
  swiftletcare-network:
    name: swiftletcare-network
    external: true
