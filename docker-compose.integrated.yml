# ==============================================================================
# SwiftletCare — Fully Integrated Multi-Service Docker Compose
# All sensitive credentials MUST be supplied via environment / --env-file.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Isolated Demo Database (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres-demo:
    image: postgres:16-alpine
    container_name: swiftletcare-postgres-demo
    hostname: postgres-demo
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
      MANAGEMENT_DB_PASSWORD: ${MANAGEMENT_DB_PASSWORD:?MANAGEMENT_DB_PASSWORD is required}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD is required}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?ANALYTICS_DB_PASSWORD is required}
      ANALYTICS_READER_PASSWORD: ${ANALYTICS_READER_PASSWORD:?ANALYTICS_READER_PASSWORD is required}
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/01_init_all.sh:/docker-entrypoint-initdb.d/01_init_all.sh:ro
      - ./infrastructure/postgres/sql:/docker-entrypoint-initdb.d/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 2. Redis State & Cache
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: swiftletcare-redis
    hostname: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
      - ${REDIS_CONF_PATH:-./infrastructure/redis/redis.conf}:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 3. RabbitMQ Message Broker
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: swiftletcare-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-swiftlet}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 4. Mosquitto MQTT Broker
  # ----------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: swiftletcare-mosquitto
    hostname: mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infrastructure/mosquitto/password_file:/mosquitto/config/password_file:ro
      - ./infrastructure/mosquitto/acl_file:/mosquitto/config/acl_file:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 5. Management Service (Port 8001)
  # ----------------------------------------------------------------------------
  management-service:
    build:
      context: ./services/management-service
      dockerfile: Dockerfile
    container_name: swiftletcare-management-service
    hostname: management-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: 8001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    depends_on:
      postgres-demo:
        condition: service_healthy
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 6. IoT Service (Port 8002)
  # ----------------------------------------------------------------------------
  iot-service:
    build:
      context: ./services/iot-service
      dockerfile: Dockerfile
    container_name: swiftletcare-iot-service
    hostname: iot-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      MANAGEMENT_SERVICE_URL: http://management-service:8001
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      IOT_SERVICE_HOST: 0.0.0.0
      IOT_SERVICE_PORT: 8002
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT_USERNAME is required}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD is required}
    depends_on:
      mosquitto:
        condition: service_started
      management-service:
        condition: service_started
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 7. AI Service (Port 8003)
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: swiftletcare-ai-service
    hostname: ai-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      AI_DATABASE_URL: ${AI_DATABASE_URL:?AI_DATABASE_URL is required}
      MANAGEMENT_SERVICE_URL: http://management-service:8001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      AI_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      AI_REDIS_ENABLED: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-swiftlet}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      INTERNAL_SERVICE_KEY: ${AI_INTERNAL_SERVICE_KEY:?AI_INTERNAL_SERVICE_KEY is required}
      AI_INTERNAL_SERVICE_KEY: ${AI_INTERNAL_SERVICE_KEY:?AI_INTERNAL_SERVICE_KEY is required}
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: 8003
    depends_on:
      postgres-demo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      management-service:
        condition: service_started
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 8. Notification Service (Port 8004)
  # ----------------------------------------------------------------------------
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: swiftletcare-notification-service
    hostname: notification-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      NOTIFICATION_DATABASE_URL: ${NOTIFICATION_DATABASE_URL:?NOTIFICATION_DATABASE_URL is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-swiftlet}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MANAGEMENT_SERVICE_URL: http://management-service:8001
      NOTIFICATION_SERVICE_HOST: 0.0.0.0
      NOTIFICATION_SERVICE_PORT: 8004
      RABBITMQ_ENABLED: "true"
    depends_on:
      postgres-demo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      management-service:
        condition: service_started
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 9. Analytics Service (Port 8005)
  # ----------------------------------------------------------------------------
  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: swiftletcare-analytics-service
    hostname: analytics-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8005:8005"
    environment:
      ANALYTICS_DATABASE_URL: ${ANALYTICS_DATABASE_URL:?ANALYTICS_DATABASE_URL is required}
      MANAGEMENT_DATABASE_URL: ${MANAGEMENT_DATABASE_URL:?MANAGEMENT_DATABASE_URL is required}
      ANALYTICS_REPOSITORY_TYPE: postgresql
      ANALYTICS_SERVICE_HOST: 0.0.0.0
      ANALYTICS_SERVICE_PORT: 8005
    depends_on:
      postgres-demo:
        condition: service_healthy
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 10. API Gateway (Port 8000)
  # ----------------------------------------------------------------------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: swiftletcare-gateway
    hostname: gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: HS256
      MANAGEMENT_SERVICE_URL: http://management-service:8001
      IOT_SERVICE_URL: http://iot-service:8002
      AI_SERVICE_URL: http://ai-service:8003
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
      ANALYTICS_SERVICE_URL: http://analytics-service:8005
      ANALYTICS_SERVICE_DEPLOYED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1
    depends_on:
      management-service:
        condition: service_started
      iot-service:
        condition: service_started
      ai-service:
        condition: service_started
      notification-service:
        condition: service_started
      analytics-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 11. Frontend Web UI (Nginx Port 3000 -> 80)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swiftletcare-frontend
    hostname: frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - swiftletcare-network

  # ----------------------------------------------------------------------------
  # 12. Observability Stack (Prometheus, Grafana, Loki, Promtail)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: swiftletcare-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - swiftletcare-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: swiftletcare-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - swiftletcare-network
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:2.9.5
    container_name: swiftletcare-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./infrastructure/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - swiftletcare-network

  promtail:
    image: grafana/promtail:2.9.5
    container_name: swiftletcare-promtail
    restart: unless-stopped
    volumes:
      - ./infrastructure/monitoring/loki/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - swiftletcare-network
    depends_on:
      - loki

volumes:
  postgres_demo_data:
    name: swiftletcare_postgres_demo_data
  redis_data:
    name: swiftletcare_redis_data
  rabbitmq_data:
    name: swiftletcare_rabbitmq_data
  mosquitto_data:
    name: swiftletcare_mosquitto_data
  prometheus_data:
    name: swiftletcare_prometheus_data
  grafana_data:
    name: swiftletcare_grafana_data
  loki_data:
    name: swiftletcare_loki_data

networks:
  swiftletcare-network:
    name: swiftletcare-network
    external: true
