# ==============================================================================
# SwiftletCare — Standalone Web Stack (Frontend + Gateway + Management + DB)
# Runs independently without AI, IoT, Notification, Analytics, or Message Brokers.
# Usage: docker compose -f docker-compose.standalone.yml --env-file .env.standalone up -d --build
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: swiftletcare-standalone-postgres
    hostname: postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STANDALONE_POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swiftlet_standalone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-swiftletcare_standalone}
    volumes:
      - standalone_pg_data:/var/lib/postgresql/data
      - ./services/management-service/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./infrastructure/postgres/sql/mgmt_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-swiftlet_standalone} -d $${POSTGRES_DB:-swiftletcare_standalone}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - standalone-net

  redis:
    image: redis:7.2-alpine
    container_name: swiftletcare-standalone-redis
    hostname: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STANDALONE_REDIS_PORT:-16379}:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - standalone_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - standalone-net

  management-service:
    build:
      context: ./services/management-service
      dockerfile: Dockerfile
    container_name: swiftletcare-standalone-management
    hostname: management-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STANDALONE_MANAGEMENT_PORT:-18001}:8001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-swiftlet_standalone}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-swiftletcare_standalone}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: 8001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      ENVIRONMENT: ${ENVIRONMENT:-standalone}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - standalone-net

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: swiftletcare-standalone-gateway
    hostname: gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STANDALONE_GATEWAY_PORT:-18000}:8000"
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
      ENVIRONMENT: ${ENVIRONMENT:-standalone}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      MANAGEMENT_SERVICE_URL: http://management-service:8001
      ANALYTICS_SERVICE_DEPLOYED: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:13000,http://127.0.0.1:13000}
    depends_on:
      management-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - standalone-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swiftletcare-standalone-frontend
    hostname: frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STANDALONE_FRONTEND_PORT:-13000}:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - standalone-net

volumes:
  standalone_pg_data:
    name: swiftletcare_standalone_pg_data
  standalone_redis_data:
    name: swiftletcare_standalone_redis_data

networks:
  standalone-net:
    driver: bridge
