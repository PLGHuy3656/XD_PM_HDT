# ==============================================================================
# SwiftletCare — INT01 Incremental Integration Stack
# Scope: Frontend + Gateway + Management V1 + IoT Service + Mosquitto + ESP32 Simulator
# Isolated from Standalone (1xxxx ports) and Docker Demo (3000/8000 ports).
#
# Usage:
#   Start:  docker compose -p swiftletcare-int01 -f docker-compose.int01.yml --env-file .env.int01 up -d --build
#   Sim:    docker compose -p swiftletcare-int01 -f docker-compose.int01.yml --env-file .env.int01 --profile simulator up -d esp32-simulator
#   Stop:   docker compose -p swiftletcare-int01 -f docker-compose.int01.yml --env-file .env.int01 stop
#   Status: docker compose -p swiftletcare-int01 -f docker-compose.int01.yml --env-file .env.int01 ps
#   Logs:   docker compose -p swiftletcare-int01 -f docker-compose.int01.yml --env-file .env.int01 logs -f
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: swiftletcare-int01-postgres
    hostname: postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INT01_POSTGRES_PORT:-25432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swiftlet_int01}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-swiftletcare_int01}
    volumes:
      - int01_pg_data:/var/lib/postgresql/data
      - ./services/management-service/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./services/management-service/database/migrations/002_add_device_metadata_version.sql:/docker-entrypoint-initdb.d/02_device_metadata_version.sql:ro
      - ./services/management-service/database/migrations/003_add_farm_approval.sql:/docker-entrypoint-initdb.d/03_farm_approval.sql:ro
      - ./infrastructure/postgres/sql/mgmt_seed.sql:/docker-entrypoint-initdb.d/04_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-swiftlet_int01} -d $${POSTGRES_DB:-swiftletcare_int01}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - int01-net

  redis:
    image: redis:7.2-alpine
    container_name: swiftletcare-int01-redis
    hostname: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INT01_REDIS_PORT:-26379}:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - int01_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - int01-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: swiftletcare-int01-mosquitto
    hostname: mosquitto
    restart: unless-stopped
    # INT01-R1: no host port. The broker is anonymous inside int01-net, so publishing it on the
    # host would let any local client inject commands/ACKs. Use `docker exec swiftletcare-int01-mosquitto
    # mosquitto_sub/mosquitto_pub` for diagnostics. A LAN-reachable authenticated listener for a
    # physical ESP32 is out of INT01 scope.
    volumes:
      - ./infrastructure/mosquitto/mosquitto.int01.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t health/check -m ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - int01-net

  management-service:
    build:
      context: ./services/management-service
      dockerfile: Dockerfile
    container_name: swiftletcare-int01-management
    hostname: management-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INT01_MANAGEMENT_PORT:-28001}:8001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-swiftlet_int01}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-swiftletcare_int01}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: 8001
      IOT_SERVICE_BASE_URL: http://iot-service:8002
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      ENVIRONMENT: ${ENVIRONMENT:-int01}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - int01-net

  iot-service:
    build:
      context: ./services/iot-service
      dockerfile: Dockerfile
    container_name: swiftletcare-int01-iot
    hostname: iot-service
    restart: unless-stopped
    # INT01-R1: no host port. IoT is reachable only inside int01-net (Gateway/Management/simulator);
    # every /api/iot/* call additionally requires X-Internal-Service-Key.
    environment:
      IOT_SERVICE_HOST: 0.0.0.0
      IOT_SERVICE_PORT: 8002
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      MQTT_AUTO_START: "true"
      MANAGEMENT_SERVICE_URL: http://management-service:8001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      METADATA_CACHE_TTL_SECONDS: ${METADATA_CACHE_TTL_SECONDS:-30}
      IOT_INTERNAL_API_AUTH_REQUIRED: "true"
      COMMAND_ACK_TIMEOUT_SECONDS: ${INT01_COMMAND_ACK_TIMEOUT_SECONDS:-15}
      COMMAND_TIMEOUT_SWEEP_INTERVAL_SECONDS: "1"
    depends_on:
      mosquitto:
        condition: service_healthy
      management-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - int01-net

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: swiftletcare-int01-gateway
    hostname: gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INT01_GATEWAY_PORT:-28000}:8000"
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
      ENVIRONMENT: ${ENVIRONMENT:-int01}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      MANAGEMENT_SERVICE_URL: http://management-service:8001
      IOT_SERVICE_URL: http://iot-service:8002
      IOT_INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      # INT01 deployment scope (drives Admin service status; AI/Notification/Analytics join in INT02-04)
      IOT_SERVICE_DEPLOYED: "true"
      AI_SERVICE_DEPLOYED: "false"
      NOTIFICATION_SERVICE_DEPLOYED: "false"
      ANALYTICS_SERVICE_DEPLOYED: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:23000,http://127.0.0.1:23000}
    depends_on:
      management-service:
        condition: service_healthy
      iot-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - int01-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swiftletcare-int01-frontend
    hostname: frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INT01_FRONTEND_PORT:-23000}:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - int01-net

  esp32-simulator:
    profiles: ["simulator"]
    build:
      context: ./services/iot-service
      dockerfile: Dockerfile
    container_name: swiftletcare-int01-simulator
    hostname: esp32-simulator
    restart: unless-stopped
    command: ["python", "/sim/esp32_simulator.py"]
    healthcheck:
      disable: true
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      DEVICE_ID: ${INT01_SIMULATOR_DEVICE_ID:-SWC-INT01-NODE-01}
      PYTHONUNBUFFERED: "1"
      # INT01-R1 opt-in negative-path testing only (default empty = normal behaviour),
      # e.g. INT01_SIM_FAULT_MODE="heater=FAILED,alarm=ERROR,fan=NOACK"
      SIM_FAULT_MODE: ${INT01_SIM_FAULT_MODE:-}
    volumes:
      - ./firmware/esp32_simulator.py:/sim/esp32_simulator.py:ro
    depends_on:
      mosquitto:
        condition: service_healthy
      iot-service:
        condition: service_healthy
    networks:
      - int01-net

volumes:
  int01_pg_data:
    name: swiftletcare_int01_pg_data
  int01_redis_data:
    name: swiftletcare_int01_redis_data

networks:
  int01-net:
    name: swiftletcare-int01-net
    driver: bridge
