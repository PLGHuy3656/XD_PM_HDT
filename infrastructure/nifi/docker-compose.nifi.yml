# ==============================================================================
# SwiftletCare — Apache NiFi Data Pipeline Service (SRS CON-07 Compliance)
# Decoupled ETL engine for historical aggregation into analytics_db.
# ==============================================================================

services:
  nifi:
    image: apache/nifi:1.25.0
    container_name: swiftletcare-nifi
    hostname: nifi
    restart: unless-stopped
    ports:
      - "8443:8443"  # NiFi Web UI (HTTPS)
    environment:
      - NIFI_WEB_HTTPS_PORT=8443
      - NIFI_WEB_PROXY_HOST=localhost:8443,127.0.0.1:8443
      - NIFI_SECURITY_USER_ADMIN=admin
      - NIFI_SECURITY_USER_PASSWORD=${NIFI_ADMIN_PASSWORD:-SwiftletCareAdmin2026!}
      - NIFI_JVM_HEAP_INIT=1024m
      - NIFI_JVM_HEAP_MAX=2048m
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_database_repository:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content_repository:/opt/nifi/nifi-current/content_repository
      - nifi_provenance_repository:/opt/nifi/nifi-current/provenance_repository
      - ./drivers:/opt/nifi/nifi-current/lib/drivers
      - ./templates:/opt/nifi/nifi-current/conf/templates
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - swiftletcare-net

volumes:
  nifi_conf:
    name: swiftletcare_nifi_conf
  nifi_database_repository:
    name: swiftletcare_nifi_database_repository
  nifi_flowfile_repository:
    name: swiftletcare_nifi_flowfile_repository
  nifi_content_repository:
    name: swiftletcare_nifi_content_repository
  nifi_provenance_repository:
    name: swiftletcare_nifi_provenance_repository

networks:
  swiftletcare-net:
    external: true
    name: swiftletcare-network
