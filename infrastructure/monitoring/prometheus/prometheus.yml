global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "api-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: "api-gateway"
          tier: "edge"

  - job_name: "management-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels:
          service: "management-service"
          tier: "backend"

  - job_name: "iot-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8002"]
        labels:
          service: "iot-service"
          tier: "backend"

  - job_name: "ai-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8003"]
        labels:
          service: "ai-service"
          tier: "processing"

  - job_name: "analytics-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8005"]
        labels:
          service: "analytics-service"
          tier: "analytics"

  - job_name: "rabbitmq"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["swiftletcare-rabbitmq:15692"]
        labels:
          service: "rabbitmq"
          tier: "messaging"
