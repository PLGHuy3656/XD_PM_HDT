groups:
  - name: swiftletcare_availability_alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service }} is DOWN"
          description: "Target {{ $labels.instance }} of service {{ $labels.service }} has been unreachable for more than 1 minute."

  - name: swiftletcare_http_performance_alerts
    rules:
      - alert: HighHttpErrorRate
        expr: >-
          (
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
            /
            sum(rate(http_requests_total[5m])) by (service)
          ) * 100 > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate on {{ $labels.service }}"
          description: "HTTP 5xx error rate for service {{ $labels.service }} is {{ $value | printf \"%.2f\" }}% (> 5%) over the last 5 minutes."

      - alert: SlowResponseLatency
        expr: >-
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)
          ) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High p95 response latency on {{ $labels.service }}"
          description: "The 95th percentile latency for service {{ $labels.service }} is {{ $value | printf \"%.2f\" }}s (> 2.0s) over the last 5 minutes."
