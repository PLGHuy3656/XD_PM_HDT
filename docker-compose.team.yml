# ==============================================================================
# SWIFTLETCARE — PORTABLE TEAM DISTRIBUTION COMPOSE (CP15)
# Designed for Cross-Member Local Execution (TV1, TV2, TV3, TV4)
# Run: docker compose -p swiftletcare-team -f docker-compose.team.yml up -d --build
# ==============================================================================

name: swiftletcare-team

services:
  # ----------------------------------------------------------------------------
  # 1. CORE DATA STACK
  # ----------------------------------------------------------------------------
  postgres-demo:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${PORT_POSTGRES:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_demo_2026}
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/01_init_all.sh:/docker-entrypoint-initdb.d/01_init_all.sh:ro
      - ./infrastructure/postgres/sql:/docker-entrypoint-initdb.d/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - team-net

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "${PORT_REDIS:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - team-net

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    ports:
      - "${PORT_RABBITMQ:-5672}:5672"
      - "${PORT_RABBITMQ_MGMT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-swiftlet}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-swiftlet123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - team-net

  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "${PORT_MOSQUITTO:-1883}:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - team-net

  # ----------------------------------------------------------------------------
  # 2. MICROSERVICES
  # ----------------------------------------------------------------------------
  management-service:
    build:
      context: ./services/management-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT_MANAGEMENT:-8001}:8001"
    environment:
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: "8001"
      DATABASE_URL: postgresql://management_user:${MGMT_DB_PASS:-mgmt_password_2026}@postgres-demo:5432/management_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-swiftletcare-team-demo-secret-key-32chars}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-swiftletcare-internal-service-mesh-key}
    depends_on:
      postgres-demo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - team-net

  iot-service:
    build:
      context: ./services/iot-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT_IOT:-8002}:8002"
    environment:
      IOT_SERVICE_HOST: 0.0.0.0
      IOT_SERVICE_PORT: "8002"
      MANAGEMENT_SERVICE_URL: http://management-service:8001
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      MQTT_CLIENT_ID: swiftletcare-iot-team
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-swiftlet}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-swiftlet123}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      management-service:
        condition: service_started
      mosquitto:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - team-net

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT_AI:-8003}:8003"
    environment:
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: "8003"
      AI_DATABASE_URL: postgresql://ai_user:${AI_DB_PASS:-ai_dev_pass_2026}@postgres-demo:5432/ai_db
      MANAGEMENT_SERVICE_URL: http://management-service:8001
      JWT_SECRET: ${JWT_SECRET:-swiftletcare-team-demo-secret-key-32chars}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-swiftletcare-internal-service-mesh-key}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-swiftlet}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-swiftlet123}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      management-service:
        condition: service_started
      postgres-demo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - team-net

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT_NOTIFICATION:-8004}:8004"
    environment:
      NOTIFICATION_SERVICE_HOST: 0.0.0.0
      NOTIFICATION_SERVICE_PORT: "8004"
      MANAGEMENT_SERVICE_URL: http://management-service:8001
      NOTIFICATION_DATABASE_URL: postgresql://notification_user:${NOTIF_DB_PASS:-notification_dev_pass_2026}@postgres-demo:5432/notification_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-swiftlet}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-swiftlet123}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      management-service:
        condition: service_started
      postgres-demo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - team-net

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT_ANALYTICS:-8005}:8005"
    environment:
      ANALYTICS_SERVICE_HOST: 0.0.0.0
      ANALYTICS_SERVICE_PORT: "8005"
      ANALYTICS_REPOSITORY_TYPE: postgresql
      ANALYTICS_DATABASE_URL: postgresql://analytics_user:${ANALYTICS_DB_PASS:-analytics_password_2026}@postgres-demo:5432/analytics_db
      MANAGEMENT_DATABASE_URL: postgresql://analytics_reader:${ANALYTICS_READER_PASS:-analytics_reader_secure_pass_2026}@postgres-demo:5432/management_db
    depends_on:
      postgres-demo:
        condition: service_healthy
    networks:
      - team-net

  # ----------------------------------------------------------------------------
  # 3. EDGE GATEWAY & FRONTEND
  # ----------------------------------------------------------------------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT_GATEWAY:-8000}:8000"
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "8000"
      JWT_SECRET: ${JWT_SECRET:-swiftletcare-team-demo-secret-key-32chars}
      JWT_ALGORITHM: HS256
      REDIS_URL: redis://redis:6379/1
      MANAGEMENT_SERVICE_URL: http://management-service:8001
      IOT_SERVICE_URL: http://iot-service:8002
      AI_SERVICE_URL: http://ai-service:8003
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
      ANALYTICS_SERVICE_URL: http://analytics-service:8005
      ANALYTICS_SERVICE_DEPLOYED: "${ANALYTICS_SERVICE_DEPLOYED:-true}"
    depends_on:
      management-service:
        condition: service_started
      iot-service:
        condition: service_started
      ai-service:
        condition: service_started
      notification-service:
        condition: service_started
      analytics-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - team-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT_FRONTEND:-3000}:80"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - team-net

  # ----------------------------------------------------------------------------
  # 4. OBSERVABILITY & MONITORING
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --storage.tsdb.retention.time=7d
    ports:
      - "${PORT_PROMETHEUS:-9090}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - team-net

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    ports:
      - "${PORT_GRAFANA:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-swiftletcare_admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      prometheus:
        condition: service_started
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - team-net

  loki:
    image: grafana/loki:2.9.5
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${PORT_LOKI:-3100}:3100"
    volumes:
      - loki_data:/loki
    networks:
      - team-net

  promtail:
    image: grafana/promtail:2.9.5
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infrastructure/monitoring/loki/promtail-config.yml:/etc/promtail/config.yml:ro
    depends_on:
      loki:
        condition: service_started
    networks:
      - team-net

# ------------------------------------------------------------------------------
# ISOLATED NETWORKS & VOLUMES (Zero conflicts with other projects)
# ------------------------------------------------------------------------------
networks:
  team-net:
    driver: bridge

volumes:
  postgres_demo_data:
  redis_data:
  rabbitmq_data:
  mosquitto_data:
  prometheus_data:
  grafana_data:
  loki_data:
